name: Veille hebdomadaire
on:
  schedule:
    - cron: '0 5 * * 1'
    - cron: '0 5 * * 4'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/veille.py
      - name: Commit
        run: |
          git config user.name "masari-veille"; git config user.email "Salmane0412@users.noreply.github.com"
          git add veille/latest.json
          git diff --cached --quiet || git commit -m "Veille: mise à jour automatique" && git push
