name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Build lite (sans blocage) pour diagnostic
        working-directory: android
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ../Masari.apk
          python3 - <<'PY'
          import re
          p='app/src/main/AndroidManifest.xml'; s=open(p).read()
          s=re.sub(r'<service.*?</service>','',s,flags=re.S); open(p,'w').write(s)
          PY
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Masari-lite.apk
      - uses: actions/upload-artifact@v4
        with:
          name: masari-lock-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk Masari.apk Masari-lite.apk --title "Masari APK" --notes "Dernière version de l'application Android" --latest=false
